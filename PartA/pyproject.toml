[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "matching-agent"
version = "0.1.0"
description = "AIE1903 Matching Game Agent — team member A"
requires-python = ">=3.12"
dependencies = ["openai>=1.66,<3", "pydantic>=2.10,<3", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
matching-agent = "matching_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: explicit opt-in tests that call the real DeepSeek API"]

